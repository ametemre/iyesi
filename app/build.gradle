// app/build.gradle (Groovy) — temizlenmiş ve release (Play Integrity) odaklı

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.googleservices)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.kurmez.iyesi'
    compileSdk 35

    defaultConfig {
        applicationId "com.kurmez.iyesi"
        minSdk 26
        //noinspection EditedTargetSdkVersion
        targetSdk 36
        versionCode 14
        versionName "Alfa"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Cloud Functions URL config
        // Cloud Functions taban alanı (region + proje)
        //buildConfigField "String", "CF_BASE_URL", "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net\""
        // Souls arama fonksiyonunun yolu: v2 onRequest fonksiyon adın neyse onu yaz
        // ÖRNEK: "/soulsSearch" ya da "/souls/search" değil!
        buildConfigField "String", "CF_PATH_SOULS_SEARCH", "\"/soulsSearch\""
        // Eğer Hosting rewrite kullanıyorsan yukarıdaki iki satırı şöyle değiştir:
        // buildConfigField "String", "CF_BASE_URL", "\"https://<senin-projen>.web.app\""
        // buildConfigField "String", "CF_PATH_SOULS_SEARCH", "\"/souls/search\""

        ///buildConfigField "String", "CF_URL_SOULS_SEARCH", "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net/souls/search\""
        buildConfigField "String", "CF_BASE_URL",      "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net\""
        buildConfigField "String", "CF_URL_ENSURECLAIMS", "\"https://ensureclaims-...a.run.app\""
        buildConfigField "String", "CF_URL_UID",           "\"https://uid-...a.run.app\""
        buildConfigField "String", "CF_URL_APP_SEND",      "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net/appSend\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug özel ayarlar gerekirse buraya
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Çalışıyorsa bırakabilirsin; sorun yaşarsan stabil NDK dizesine geç
    ndkVersion '28.0.12674087 rc2'

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // .tflite dosyalarını sıkıştırma (AGP 8+)
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // ===================== Firebase (BoM ile) =====================
    implementation platform('com.google.firebase:firebase-bom:33.7.0')

    // Temel servisler (sürüm belirtmeden)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'

    // App Check – çekirdek + provider’lar (varyant bazlı)
    implementation       'com.google.firebase:firebase-appcheck'
    implementation libs.firebase.appcheck.playintegrity
    implementation libs.litert.gpu.api
    implementation libs.swiperefreshlayout// opsiyonel ama netlik için ekli
    debugImplementation  'com.google.firebase:firebase-appcheck-debug'
    releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'

    // ===================== Google Play services / Maps & Location =====================
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // ===================== OpenCV (module) =====================
    implementation project(':OpenCV_4.10.0')

    // ===================== ZXing / QR =====================
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ===================== Glide =====================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ===================== OkHttp =====================
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // ===================== TensorFlow Lite (SEÇENEK A: Upstream TF ekosistemi) =====================
    // Not: GMS TFLite paketleriyle karıştırma. Tek ekosisteme odaklan.
    implementation 'org.tensorflow:tensorflow-lite:2.15.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.15.0'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.15.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-task-audio:0.4.4'

    // Eğer GMS TFLite ekosistemini tercih edeceksen, yukarıdakileri kaldır ve bunun yerine:
    // implementation "com.google.android.gms:play-services-tflite-impl:16.2.0"
    // implementation "com.google.android.gms:play-services-tflite-gpu:16.2.0"
    // implementation "com.google.android.gms:play-services-tflite-support:16.2.0"

    // ===================== Conscrypt (opsiyonel TLS) =====================
    // Sadece belirli TLS/SSL sorunları yaşıyorsan etkinleştir.
    // implementation "org.conscrypt:conscrypt-android:2.5.2"
    implementation "com.google.android.play:integrity:1.5.0" // veya daha yeni

    // ===================== AndroidX =====================
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // ===================== Test =====================
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
