plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
    alias(libs.plugins.kotlin.android)
}
android {
    namespace 'com.kurmez.iyesi'
    compileSdk 35
    defaultConfig {
        applicationId "com.kurmez.iyesi"
        minSdk 30
        //noinspection EditedTargetSdkVersion
        targetSdk 35
        versionCode 2
        versionName "0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion '28.0.12674087 rc2'
    buildFeatures {
        viewBinding true
    }
    aaptOptions {
        noCompress "tflite"
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    //buildToolsVersion '34.0.0'
}
dependencies {
    implementation(platform('com.google.firebase:firebase-bom:33.7.0'))
    implementation 'com.google.firebase:firebase-firestore:25.1.1'
    implementation("com.google.firebase:firebase-analytics")
    implementation 'com.google.firebase:firebase-auth:23.1.0'
    implementation 'com.google.firebase:firebase-auth:21.2.0'
    implementation libs.firebase.functions
    implementation libs.firebase.storage
    implementation libs.firebase.auth

    // core
    implementation 'org.tensorflow:tensorflow-lite:2.12.0'  // Core TFLite
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.12.0'  // GPU delegate
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.12.0'  // GPU API
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.12.0'
    implementation "org.tensorflow:tensorflow-lite-support:0.4.3"
    implementation 'org.tensorflow:tensorflow-lite-task-audio:0.2.0'
    implementation 'org.tensorflow:tensorflow-lite-task-text:0.2.0'

    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    implementation project(':OpenCV_4.10.0')

    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-extensions:1.4.1'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}