plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.googleservices)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.kurmez.iyesi'
    compileSdk 35

    defaultConfig {
        applicationId "com.kurmez.iyesi"
        minSdk 26
        //noinspection EditedTargetSdkVersion
        targetSdk 36
        versionCode 10
        versionName "Alfa"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Cloud Functions URL config (örnek)
        buildConfigField "String", "CF_URL_ENSURECLAIMS", "\"https://ensureclaims-...a.run.app\""
        buildConfigField "String", "CF_URL_UID", "\"https://uid-...a.run.app\""
        // ... diğerleri
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug özel ayarlar gerekirse buraya
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    ndkVersion '28.0.12674087 rc2'

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // .tflite dosyalarını sıkıştırma
    aaptOptions {
        noCompress "tflite"
    }
    // buildToolsVersion '34.0.0'
}

dependencies {
    implementation libs.firebase.appcheck.playintegrity
    dependencies {
        // --- Google Play services / Maps & Location ---
        implementation 'com.google.android.gms:play-services-location:21.0.1'
        implementation 'com.google.android.gms:play-services-maps:18.1.0'
        implementation 'com.google.maps.android:android-maps-utils:3.8.2'

        // --- OpenCV (modül) ---
        implementation project(':OpenCV_4.10.0')

        // --- ZXing / QR ---
        implementation 'com.google.zxing:core:3.5.3'
        implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

        // --- Glide ---
        implementation 'com.github.bumptech.glide:glide:4.16.0'
        annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

        // --- OkHttp ---
        implementation "com.squareup.okhttp3:okhttp:4.10.0"

        // --- TensorFlow Lite ekosistemi ---  (sürümleri mümkünse hizala)
        implementation 'org.tensorflow:tensorflow-lite:2.15.0'
        implementation 'org.tensorflow:tensorflow-lite-gpu:2.15.0'
        implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.12.0'
        implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.12.0'
        implementation "org.tensorflow:tensorflow-lite-support:0.4.3"
        implementation 'org.tensorflow:tensorflow-lite-task-audio:0.2.0'
        implementation 'org.tensorflow:tensorflow-lite-task-text:0.2.0'
        implementation "com.google.android.gms:play-services-tflite-impl:16.1.0"
        implementation "com.google.android.gms:play-services-tflite-gpu:16.2.0"
        implementation "com.google.android.gms:play-services-tflite-support:16.1.0"

        // --- Conscrypt (opsiyonel TLS) ---
        implementation "org.conscrypt:conscrypt-android:2.5.2"

        // --- AndroidX ---
        implementation libs.appcompat
        implementation libs.material
        implementation libs.activity
        implementation libs.constraintlayout

        // --- Test ---
        testImplementation libs.junit
        androidTestImplementation libs.ext.junit
        androidTestImplementation libs.espresso.core

        // ===================== Firebase =====================
        // BoM: TEK satır
        implementation platform('com.google.firebase:firebase-bom:33.7.0')

        // Temel servisler (sürüm belirtmeden)
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-auth'
        implementation 'com.google.firebase:firebase-firestore'
        implementation 'com.google.firebase:firebase-functions'
        implementation 'com.google.firebase:firebase-storage'
        implementation 'com.google.firebase:firebase-database'

        // App Check – çekirdek
        implementation 'com.google.firebase:firebase-appcheck'

        // App Check – provider’lar (varyant bazlı)
        debugImplementation   'com.google.firebase:firebase-appcheck-debug'
        releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'
    }

}
