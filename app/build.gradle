// app/build.gradle — OOM fix + tek App Check sağlayıcı

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.googleservices)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.kurmez.iyesi'
    compileSdk 35

    defaultConfig {
        applicationId "com.kurmez.iyesi"
        minSdk 23
        //noinspection EditedTargetSdkVersion
        targetSdk 37
        versionCode 20
        versionName "Wolf"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Cloud Functions URL config
        buildConfigField "String", "CF_PATH_SOULS_SEARCH", "\"/soulsSearch\""
        buildConfigField "String", "CF_BASE_URL",           "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net\""
        buildConfigField "String", "CF_URL_ENSURECLAIMS",   "\"https://ensureclaims-...a.run.app\""
        buildConfigField "String", "CF_URL_UID",            "\"https://uid-...a.run.app\""
        buildConfigField "String", "CF_URL_APP_SEND",       "\"https://us-central1-iyesi-e8d4f.cloudfunctions.net/appSend\""

        // Vector → PNG türetmeyi kapatıp destek kütüphanesini aç (mergeResources OOM’u düşürür)
        vectorDrawables {
            useSupportLibrary = true
            // generatedDensities=[]  // AGP 8+ için gerekmez; PNG türetme zaten yok
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug özel ayarlar gerekirse
        }
    }

    // Aşırı büyük kaynakları geçici izole etmek istersen, burada exclude kalıbı ekleyebilirsin.
    // packagingOptions {
    //     resources {
    //         excludes += ["res/drawable/**/large_*"] // ÖRNEK
    //     }
    // }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Çalışıyorsa bırakabilirsin; sorun yaşarsan stabil NDK dizesine geç
    ndkVersion '28.0.12674087 rc2'

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // .tflite dosyalarını sıkıştırma (AGP 8+)
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // ===================== Firebase (BoM ile) =====================
    implementation platform('com.google.firebase:firebase-bom:34.2.0')

    // Temel servisler (sürüm belirtmeden)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'

    // App Check – çekirdek + Play Integrity (tek sağlayıcı; çakışmayı önlemek için releaseImplementation satırını kaldırdık)
    implementation 'com.google.firebase:firebase-appcheck'
    implementation libs.firebase.appcheck.playintegrity
    implementation libs.litert.gpu.api
    implementation libs.swiperefreshlayout
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // ===================== Google Play services / Maps & Location =====================
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // ===================== OpenCV (module) =====================
    implementation project(':OpenCV_4.10.0')

    // ===================== ZXing / QR =====================
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ===================== Glide =====================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ===================== OkHttp =====================
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // ===================== TensorFlow Lite (Upstream TF ekosistemi) =====================
    implementation('org.tensorflow:tensorflow-lite:2.15.0') {
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation('org.tensorflow:tensorflow-lite-gpu:2.15.0') {
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation('org.tensorflow:tensorflow-lite-select-tf-ops:2.15.0') {
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation('org.tensorflow:tensorflow-lite-support:0.4.4') {
        exclude group: 'com.google.inject', module: 'guice'
    }
    implementation('org.tensorflow:tensorflow-lite-task-audio:0.4.4') {
        exclude group: 'com.google.inject', module: 'guice'
    }

    // ===================== Play Integrity API (isteğe bağlı) =====================
    implementation libs.play.integrity

    // ===================== AndroidX =====================
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // ===================== Test =====================
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
